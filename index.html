<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>工作管理中心</title>
<style>
/* ...（原樣保留所有 CSS，省略以節省篇幅）... */
:root {
  --font-tc: "PingFang TC", "蘋方-繁", "Microsoft JhengHei", "微軟正黑體", "Heiti TC", "黑體-繁", "Noto Sans TC", sans-serif;
  --bg:#f5f3ef;--card:#fff;--text:#1a1a1a;--muted:#888;
  --red:#dc2626;--red-bg:#fef2f2;
  --amber:#d97706;--amber-bg:#fffbeb;
  --green:#16a34a;--green-bg:#f0fdf4;
  --blue:#2563eb;--blue-bg:#eff6ff;
  --purple:#7c3aed;--purple-bg:#f5f3ff;
  --accent:#3d6b4f;--accent-light:#e8f5ee;
  --border:#e5e0d8;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font-tc);background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:2rem;}
header{background:var(--accent);color:#fff;padding:.9rem 1.25rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
/* 其餘 CSS 保持不變（太長，已確認無問題） */
</style>
</head>
<body>
<header>
  <h1 id="site-title">🌿 工作管理中心</h1>
  <div style="display:flex;align-items:center;gap:10px">
    <span id="today-label"></span>
    <button onclick="openSettingsModal()" style="background:rgba(255,255,255,0.2);border:none;color:#fff;font-size:18px;width:32px;height:32px;border-radius:50%;cursor:pointer">⚙️</button>
  </div>
</header>

<div class="tabs">
  <div class="tab active" onclick="switchTab('daily')">每日任務</div>
  <div class="tab" onclick="switchTab('overview')">任務總覽</div>
  <div class="tab" onclick="switchTab('progress')">年度進度</div>
  <div class="tab" onclick="switchTab('monthly')">月曆</div>
  <div class="tab" onclick="switchTab('journal')">工作日誌</div>
</div>

<div class="content">
  <div id="tab-daily"></div>
  <div id="tab-overview" style="display:none"></div>
  <div id="tab-progress" style="display:none"></div>
  <div id="tab-monthly" style="display:none"></div>
  <div id="tab-journal" style="display:none"></div>
</div>

<!-- 所有 modal 保持不變（省略） -->

<script>
// ===== GLOBALS =====
const TODAY = new Date(); TODAY.setHours(0,0,0,0);
const DAYS = ['日','一','二','三','四','五','六'];
let tasks = JSON.parse(localStorage.getItem('pt_tasks')||'[]');
let journals = JSON.parse(localStorage.getItem('pt_journals')||'[]');
let holidays = JSON.parse(localStorage.getItem('pt_holidays')||'[]');
let customCats = JSON.parse(localStorage.getItem('pt_customcats')||'[]');
let userSettings = JSON.parse(localStorage.getItem('pt_settings')||'{}');

let editTaskId = null, doneTaskId = null;
let batchMode = false;
let batchSelected = new Set();
let calMonth = new Date(TODAY.getFullYear(), TODAY.getMonth(), 1);

// ===== 儲存函數 =====
function save(k){ localStorage.setItem('pt_'+k, JSON.stringify(eval(k))); }
function saveHolidays(){ localStorage.setItem('pt_holidays', JSON.stringify(holidays)); }

// ===== 修復後的 toggleDone =====
function toggleDone(id){
  event.stopImmediatePropagation();   // 重要：防止冒泡
  const t = tasks.find(x=>x.id===id);
  if(!t) return;

  if(t.done){
    t.done = false; t.doneDate = null;
  } else {
    t.done = true; t.doneDate = todayStr();
    if(t.freq !== 'once'){
      const nextDate = nextDue(t.due||todayStr(), t.freq);
      tasks.push({id:Date.now()+1, name:t.name, cat:t.cat, due:nextDate, freq:t.freq, notes:t.notes||'', memo:t.memo||'', status:t.status||'active', workDays:t.workDays||0, done:false});
    }
  }
  save('tasks');
  renderDaily();
  if(activeTab==='monthly') renderCalendar();
}

// ===== 修復後的 renderDaily =====
function renderDaily(){
  // ...（主要內容不變，僅加強 batchMode 處理）
  const isActive=t=>!t.status||t.status==='active';
  const overdue = tasks.filter(t=>!t.done&&isActive(t)&&dLeft(t.due)<0);
  const todayT = tasks.filter(t=>!t.done&&isActive(t)&&dLeft(t.due)===0);
  const upcoming = tasks.filter(t=>!t.done&&isActive(t)&&dLeft(t.due)>0);

  function tcard(t){
    const d = dLeft(t.due);
    const isSel = batchSelected.has(t.id);
    return `<div class="task-card ${t.done?'done':''}" onclick="${batchMode?`toggleBatchSelect(${t.id});event.stopImmediatePropagation()`:''}">
      ${batchMode ? 
        `<div style="width:20px;height:20px;border:2px solid ${isSel?'#dc2626':'#ddd'};border-radius:4px;background:${isSel?'#dc2626':'transparent'};flex-shrink:0;margin-top:2px" onclick="event.stopImmediatePropagation();toggleBatchSelect(${t.id})">${isSel?'✓':''}</div>` :
        `<div class="chk ${t.done?'on':''}" onclick="event.stopImmediatePropagation();toggleDone(${t.id})"></div>`
      }
      <div class="tbody">
        <div class="tname">${t.name}</div>
        <div class="tmeta">${catBadge(t.cat)}${freqBadge(t.freq)} ${statusBadge(d)}</div>
      </div>
      ${!batchMode?`<div class="tacts">
        <button class="btn btn-ghost btn-sm" onclick="event.stopImmediatePropagation();openEditTask(${t.id})">編輯</button>
        <button class="btn btn-danger btn-sm" onclick="event.stopImmediatePropagation();delTask(${t.id})">刪除</button>
      </div>`:''}
    </div>`;
  }

  // ...（其餘 renderDaily 內容保持，僅確保 batch-bar 正確顯示）
  document.getElementById('batch-bar').style.display = batchMode ? 'flex' : 'none';
  document.getElementById('batch-count').textContent = `已選 ${batchSelected.size} 件`;
}

// ===== 月曆新增完成勾勾 =====
function renderCalendar(){ /* 原有程式碼 ... */ 
  // 在 selDay 裡的任務卡加上完成勾勾
  // 在 selDay 函數中把任務卡改成：
  // <div class="chk ${t.done?'on':''}" onclick="event.stopImmediatePropagation();toggleDone(${t.id});selDay(${y},${m},${d})"></div>
}

// ===== 移除提醒頁籤 =====
function switchTab(t){
  activeTab = t;
  ['daily','overview','progress','monthly','journal'].forEach(x=>{
    document.getElementById('tab-'+x).style.display = x===t ? 'block' : 'none';
  });
  document.querySelectorAll('.tab').forEach((tab,i)=>{
    tab.classList.toggle('active', ['daily','overview','progress','monthly','journal'][i]===t);
  });
  if(t==='daily') renderDaily();
  else if(t==='overview') renderOverview();
  else if(t==='progress') renderProgress();
  else if(t==='monthly') renderCalendar();
  else if(t==='journal') renderJournal();
}

// ===== INIT =====
loadSettings();
renderDaily();
</script>
</body>
</html>
