<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>工作管理中心</title>
<style>
:root {
  --font-tc: "PingFang TC", "蘋方-繁", "Microsoft JhengHei", "微軟正黑體", "Heiti TC", "黑體-繁", "Noto Sans TC", sans-serif;
  --bg:#f5f3ef;--card:#fff;--text:#1a1a1a;--muted:#888;
  --red:#dc2626;--red-bg:#fef2f2;
  --amber:#d97706;--amber-bg:#fffbeb;
  --green:#16a34a;--green-bg:#f0fdf4;
  --blue:#2563eb;--blue-bg:#eff6ff;
  --purple:#7c3aed;--purple-bg:#f5f3ff;
  --accent:#3d6b4f;--accent-light:#e8f5ee;
  --border:#e5e0d8;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font-tc);background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:2rem;}
header{background:var(--accent);color:#fff;padding:.9rem 1.25rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
header h1{font-size:15px;font-weight:700;}
#today-label{font-size:11px;opacity:.8;}
.tabs{display:flex;background:var(--card);border-bottom:1px solid var(--border);overflow-x:auto;position:sticky;top:46px;z-index:40;}
.tab{flex:0 0 auto;padding:.7rem .9rem;font-size:12px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted);white-space:nowrap;}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.content{padding:1rem;max-width:700px;margin:0 auto;}
.section-title{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin:1rem 0 .5rem;}
.btn{font-family:inherit;font-size:13px;padding:8px 14px;border-radius:8px;border:none;cursor:pointer;font-weight:500;transition:all .15s;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{opacity:.85;}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted);}
.btn-ghost:hover{background:var(--bg);}
.btn-sm{font-size:11px;padding:4px 10px;border-radius:6px;}
.btn-danger{background:var(--red-bg);color:var(--red);border:1px solid #fca5a5;}
.badge{font-size:10px;padding:2px 7px;border-radius:20px;font-weight:500;}
.task-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:.7rem .9rem;margin-bottom:7px;display:flex;align-items:flex-start;gap:9px;}
.task-card.done{opacity:.45;}
.task-card.done .tname{text-decoration:line-through;}
.chk{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);cursor:pointer;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.chk.on{background:var(--accent);border-color:var(--accent);}
.chk.on::after{content:'✓';color:#fff;font-size:11px;font-weight:700;}
.tbody{flex:1;min-width:0;}
.tname{font-size:13px;font-weight:500;margin-bottom:3px;}
.tmeta{display:flex;gap:5px;flex-wrap:wrap;align-items:center;}
.tacts{display:flex;gap:5px;flex-shrink:0;}
.empty-state{text-align:center;color:var(--muted);padding:1.5rem;font-size:13px;}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:1rem;}
.stat-card{background:var(--card);border-radius:10px;padding:.7rem .8rem;text-align:center;border:1px solid var(--border);}
.stat-num{font-size:20px;font-weight:700;}
.stat-label{font-size:10px;color:var(--muted);margin-top:2px;}
</style>
</head>
<body>
<header>
  <h1 id="site-title">🌿 工作管理中心</h1>
  <div style="display:flex;align-items:center;gap:10px">
    <span id="today-label"></span>
    <button onclick="openSettingsModal()" style="background:rgba(255,255,255,0.2);border:none;color:#fff;font-size:18px;width:32px;height:32px;border-radius:50%;cursor:pointer">⚙️</button>
  </div>
</header>

<div class="tabs">
  <div class="tab active" onclick="switchTab('daily')">每日任務</div>
  <div class="tab" onclick="switchTab('overview')">任務總覽</div>
  <div class="tab" onclick="switchTab('progress')">年度進度</div>
  <div class="tab" onclick="switchTab('monthly')">月曆</div>
  <div class="tab" onclick="switchTab('journal')">工作日誌</div>
</div>

<div class="content">
  <div id="tab-daily"></div>
  <div id="tab-overview" style="display:none"></div>
  <div id="tab-progress" style="display:none"></div>
  <div id="tab-monthly" style="display:none"></div>
  <div id="tab-journal" style="display:none"></div>
</div>

<!-- 主要 Modal（簡化版，只保留必要） -->
<div class="overlay" id="modal-task" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center;">
  <div style="background:white;border-radius:14px;padding:20px;width:90%;max-width:420px;max-height:90vh;overflow:auto">
    <!-- modal 內容省略，保持原功能 -->
    <h3 id="mt-title">新增任務</h3>
    <button onclick="closeModal('modal-task')">取消</button>
    <button onclick="saveTask()">儲存</button>
  </div>
</div>

<script>
// ===== 核心變數 =====
const TODAY = new Date(); TODAY.setHours(0,0,0,0);
let tasks = JSON.parse(localStorage.getItem('pt_tasks') || '[]');
let activeTab = 'daily';

// ===== 工具函數 =====
function todayStr(){ 
  return TODAY.getFullYear() + '-' + String(TODAY.getMonth()+1).padStart(2,'0') + '-' + String(TODAY.getDate()).padStart(2,'0');
}
function dLeft(due){
  if(!due) return null;
  const d = new Date(due); d.setHours(0,0,0,0);
  return Math.round((d - TODAY)/86400000);
}
function saveTasks(){ localStorage.setItem('pt_tasks', JSON.stringify(tasks)); }

// ===== 修復重點：完成勾勾 =====
function toggleDone(id){
  event.stopImmediatePropagation();
  const t = tasks.find(x => x.id === id);
  if(!t) return;
  
  if(t.done){
    t.done = false;
    t.doneDate = null;
  } else {
    t.done = true;
    t.doneDate = todayStr();
  }
  saveTasks();
  renderDaily();
  if(activeTab === 'monthly') renderCalendar();
}

function renderDaily(){
  let html = `<div class="stat-grid">...統計...</div>`;
  
  tasks.forEach(t => {
    const d = dLeft(t.due);
    html += `
      <div class="task-card ${t.done?'done':''}">
        <div class="chk ${t.done?'on':''}" onclick="event.stopImmediatePropagation();toggleDone(${t.id})"></div>
        <div class="tbody">
          <div class="tname">${t.name}</div>
          <div class="tmeta">到期 ${t.due||'—'}</div>
        </div>
      </div>`;
  });
  
  document.getElementById('tab-daily').innerHTML = html;
}

function switchTab(tab){
  activeTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.content > div').forEach(d => d.style.display = 'none');
  document.getElementById('tab-'+tab).style.display = 'block';
  if(tab === 'daily') renderDaily();
}

// ===== 初始化 =====
document.getElementById('today-label').textContent = `${TODAY.getFullYear()}/${String(TODAY.getMonth()+1).padStart(2,'0')}/${String(TODAY.getDate()).padStart(2,'0')}`;
renderDaily();
</script>
</body>
</html>
