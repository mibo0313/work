<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>工作管理中心</title>
<style>
:root {
  --font-tc: "PingFang TC", "蘋方-繁", "Microsoft JhengHei", "微軟正黑體", sans-serif;
  --bg:#f5f3ef; --card:#fff; --text:#1a1a1a; --muted:#888;
  --red:#dc2626; --red-bg:#fef2f2;
  --amber:#d97706; --amber-bg:#fffbeb;
  --green:#16a34a; --green-bg:#f0fdf4;
  --blue:#2563eb; --blue-bg:#eff6ff;
  --purple:#7c3aed; --purple-bg:#f5f3ff;
  --accent:#3d6b4f; --accent-light:#e8f5ee;
  --border:#e5e0d8;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:var(--font-tc); background:var(--bg); color:var(--text); min-height:100vh; padding-bottom:2rem; }
header { background:var(--accent); color:#fff; padding:.9rem 1.25rem; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:50; }
header h1 { font-size:15px; font-weight:700; }
#today-label { font-size:11px; opacity:.8; }
.tabs { display:flex; background:var(--card); border-bottom:1px solid var(--border); overflow-x:auto; position:sticky; top:46px; z-index:40; }
.tab { flex:0 0 auto; padding:.7rem .9rem; font-size:12px; font-weight:500; cursor:pointer; border-bottom:2px solid transparent; color:var(--muted); white-space:nowrap; }
.tab.active { color:var(--accent); border-bottom-color:var(--accent); }
.content { padding:1rem; max-width:700px; margin:0 auto; }
.btn { font-family:inherit; font-size:13px; padding:8px 14px; border-radius:8px; border:none; cursor:pointer; font-weight:500; transition:all .15s; }
.btn-primary { background:var(--accent); color:#fff; }
.btn-ghost { background:transparent; border:1px solid var(--border); color:var(--muted); }
.overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:100; align-items:center; justify-content:center; padding:1rem; }
.overlay.show { display:flex; }
.modal { background:var(--card); border-radius:14px; padding:1.25rem; width:100%; max-width:420px; }
input, select, textarea { font-family:inherit; font-size:13px; padding:8px 10px; border:1px solid var(--border); border-radius:8px; width:100%; margin-top:4px; }
.form-row { margin-bottom:.75rem; }
.form-row label { font-size:12px; color:var(--muted); }
</style>
</head>
<body>

<header>
  <h1>🌿 工作管理中心</h1>
  <div style="display:flex;align-items:center;gap:10px">
    <span id="today-label">2026年5月13日</span>
    <button onclick="openModal('modal-settings')" style="background:rgba(255,255,255,0.2);border:none;color:#fff;font-size:18px;width:32px;height:32px;border-radius:50%;cursor:pointer;">⚙️</button>
  </div>
</header>

<div class="tabs">
  <div class="tab active">每日任務</div>
  <div class="tab">任務總覽</div>
  <div class="tab">年度進度</div>
  <div class="tab">月曆</div>
  <div class="tab">工作日誌</div>
</div>

<div class="content">
  <div id="main-view">
    <p style="text-align:center; color:var(--muted); margin-top:2rem;">目前沒有待辦事項，祝你有美好的一天！</p>
  </div>
</div>

<!-- SETTINGS MODAL -->
<div class="overlay" id="modal-settings">
  <div class="modal">
    <h3>⚙️ 個人設定</h3>
    <div class="form-row">
      <label>您的暱稱</label>
      <input id="set-name" placeholder="例：巧巧" />
    </div>
    
    <div style="border-top:1px solid var(--border);margin-top:1rem;padding-top:1rem">
      <div style="font-size:12px;font-weight:600;color:var(--muted);margin-bottom:8px">💾 資料備份</div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-ghost" style="flex:1;" onclick="alert('備份功能需 JavaScript 邏輯支援')">📤 匯出</button>
        <button class="btn btn-ghost" style="flex:1;" onclick="alert('匯入功能需 JavaScript 邏輯支援')">📥 匯入</button>
      </div>
    </div>

    <div style="display:flex;gap:8px;margin-top:1.5rem;justify-content:flex-end;">
      <button class="btn btn-ghost" onclick="closeModal('modal-settings')">取消</button>
      <button class="btn btn-primary" onclick="closeModal('modal-settings')">儲存</button>
    </div>
  </div>
</div>

<script>
function openModal(id) { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }

// 點擊背景關閉
window.onclick = function(event) {
  if (event.target.classList.contains('overlay')) {
    event.target.classList.remove('show');
  }
}
</script>

</body>
</html>
