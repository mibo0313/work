<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>沛婷工作管理中心</title>
<style>
:root {
  --accent:#3d6b4f; --accent-light:#e8f5ee; --bg:#f5f3ef; --card:#fff; --text:#1a1a1a; --muted:#888;
  --red:#dc2626; --amber:#d97706; --green:#16a34a; --border:#e5e0d8;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
header{background:var(--accent);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
.tabs{display:flex;background:white;border-bottom:1px solid var(--border);overflow-x:auto;position:sticky;top:52px;z-index:40;}
.tab{padding:12px 16px;font-size:14px;white-space:nowrap;cursor:pointer;border-bottom:3px solid transparent;}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600;}
.content{padding:16px;max-width:720px;margin:0 auto;}
.task-card{background:white;border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start;}
.chk{width:24px;height:24px;border:2px solid #ccc;border-radius:50%;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.chk.on{background:var(--accent);border-color:var(--accent);color:white;}
.btn{padding:8px 16px;border-radius:8px;border:none;cursor:pointer;}
.btn-primary{background:var(--accent);color:white;}
.empty-state{text-align:center;color:#888;padding:40px 20px;}
</style>
</head>
<body>

<header>
  <h1 id="site-title">🌿 工作管理中心</h1>
  <button onclick="openSettingsModal()" style="background:none;border:none;color:white;font-size:24px;cursor:pointer">⚙️</button>
</header>

<div class="tabs">
  <div class="tab active" onclick="switchTab(0)">每日任務</div>
  <div class="tab" onclick="switchTab(1)">任務總覽</div>
  <div class="tab" onclick="switchTab(2)">年度進度</div>
  <div class="tab" onclick="switchTab(3)">月曆</div>
  <div class="tab" onclick="switchTab(4)">工作日誌</div>
</div>

<div class="content" id="main-content"></div>

<script>
// 核心變數
let tasks = JSON.parse(localStorage.getItem('pt_tasks') || '[]');
let activeTab = 0;

const TODAY = new Date();
TODAY.setHours(0,0,0,0);

function todayStr() {
  return TODAY.getFullYear() + '-' + String(TODAY.getMonth()+1).padStart(2,'0') + '-' + String(TODAY.getDate()).padStart(2,'0');
}

function dLeft(due) {
  if (!due) return 999;
  const d = new Date(due);
  d.setHours(0,0,0,0);
  return Math.round((d - TODAY) / 86400000);
}

function saveTasks() {
  localStorage.setItem('pt_tasks', JSON.stringify(tasks));
}

// 完成勾勾（已修復）
function toggleDone(id) {
  event.stopImmediatePropagation();
  const task = tasks.find(t => t.id === id);
  if (!task) return;
  
  task.done = !task.done;
  if (task.done) task.doneDate = todayStr();
  else task.doneDate = null;
  
  saveTasks();
  renderCurrentTab();
}

// 渲染目前分頁
function renderCurrentTab() {
  const content = document.getElementById('main-content');
  
  if (activeTab === 0) { // 每日任務
    let html = `<h2 style="margin-bottom:16px">今日任務</h2>`;
    if (tasks.length === 0) {
      html += `<div class="empty-state">目前沒有任務<br><button class="btn btn-primary" onclick="openNewTask()" style="margin-top:16px">新增任務</button></div>`;
    } else {
      tasks.forEach(t => {
        const days = dLeft(t.due);
        html += `
          <div class="task-card" style="${t.done ? 'opacity:0.6' : ''}">
            <div class="chk ${t.done ? 'on' : ''}" onclick="toggleDone(${t.id})">${t.done ? '✓' : ''}</div>
            <div style="flex:1">
              <div style="font-weight:500">${t.name}</div>
              <div style="font-size:13px;color:#666">${t.due ? t.due : '無到期日'} ${days <= 7 && days >= 0 ? '（即將到期）' : ''}</div>
            </div>
          </div>`;
      });
    }
    content.innerHTML = html;
  } 
  else if (activeTab === 3) { // 月曆簡化版
    content.innerHTML = `<h2>月曆功能開發中...（可點選日期後勾選任務）</h2>`;
  } 
  else {
    content.innerHTML = `<h2>此分頁開發中</h2>`;
  }
}

function switchTab(n) {
  activeTab = n;
  document.querySelectorAll('.tab').forEach((tab, i) => {
    tab.classList.toggle('active', i === n);
  });
  renderCurrentTab();
}

function openNewTask() {
  const name = prompt("任務名稱：");
  if (name) {
    tasks.push({
      id: Date.now(),
      name: name,
      due: todayStr(),
      done: false
    });
    saveTasks();
    renderCurrentTab();
  }
}

function openSettingsModal() {
  alert("設定功能開發中\n\n目前已強制使用綠葉圖示\n請重新「加入主畫面」即可看到效果");
}

// 初始化
document.getElementById('site-title').textContent = "🌿 沛婷的工作管理中心";
renderCurrentTab();
</script>
</body>
</html>
