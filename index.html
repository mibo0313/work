<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="./manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="工作管理">
<meta name="theme-color" content="#3d6b4f" id="meta-theme">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>沛婷工作管理中心</title>
<style>
/* 內嵌系統字體堆疊：優先使用各平台內建繁體中文字體，完全離線可用 */
:root {
  --font-tc: "PingFang TC", "蘋方-繁", "Microsoft JhengHei", "微軟正黑體",
             "Heiti TC", "黑體-繁", "Noto Sans TC", "Apple SD Gothic Neo",
             "Hiragino Sans", sans-serif;
}
</style>
<style>
:root{
  --bg:#f5f3ef;--card:#fff;--text:#1a1a1a;--muted:#888;
  --red:#dc2626;--red-bg:#fef2f2;
  --amber:#d97706;--amber-bg:#fffbeb;
  --green:#16a34a;--green-bg:#f0fdf4;
  --blue:#2563eb;--blue-bg:#eff6ff;
  --purple:#7c3aed;--purple-bg:#f5f3ff;
  --accent:#3d6b4f;--accent-light:#e8f5ee;
  --border:#e5e0d8;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font-tc);background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:2rem;}
header{background:var(--accent);color:#fff;padding:.9rem 1.25rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
header h1{font-size:15px;font-weight:700;}
#today-label{font-size:11px;opacity:.8;}
.tabs{display:flex;background:var(--card);border-bottom:1px solid var(--border);overflow-x:auto;position:sticky;top:46px;z-index:40;}
.tab{flex:0 0 auto;padding:.7rem .9rem;font-size:12px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted);white-space:nowrap;}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.content{padding:1rem;max-width:700px;margin:0 auto;}
.section-title{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin:1rem 0 .5rem;}
.btn{font-family:inherit;font-size:13px;padding:8px 14px;border-radius:8px;border:none;cursor:pointer;font-weight:500;transition:all .15s;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{opacity:.85;}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted);}
.btn-ghost:hover{background:var(--bg);}
.btn-sm{font-size:11px;padding:4px 10px;border-radius:6px;}
.btn-danger{background:var(--red-bg);color:var(--red);border:1px solid #fca5a5;}
.badge{font-size:10px;padding:2px 7px;border-radius:20px;font-weight:500;}
.badge-red{background:var(--red-bg);color:var(--red);}
.badge-amber{background:var(--amber-bg);color:var(--amber);}
.badge-green{background:var(--green-bg);color:var(--green);}
.badge-blue{background:var(--blue-bg);color:var(--blue);}
.badge-gray{background:var(--bg);color:var(--muted);border:1px solid var(--border);}
input,select,textarea{font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);width:100%;}
textarea{resize:vertical;}

/* TASK */
.add-bar{display:flex;gap:7px;margin-bottom:1rem;}
.add-bar input{flex:1;}
.add-bar select{width:86px;flex-shrink:0;}
.add-bar .btn{flex-shrink:0;}
.task-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:.7rem .9rem;margin-bottom:7px;display:flex;align-items:flex-start;gap:9px;}
.task-card.done{opacity:.45;}
.task-card.done .tname{text-decoration:line-through;}
.chk{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);cursor:pointer;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.chk.on{background:var(--accent);border-color:var(--accent);}
.chk.on::after{content:'✓';color:#fff;font-size:11px;font-weight:700;}
.tbody{flex:1;min-width:0;}
.tname{font-size:13px;font-weight:500;margin-bottom:3px;}
.tmeta{display:flex;gap:5px;flex-wrap:wrap;align-items:center;}
.tacts{display:flex;gap:5px;flex-shrink:0;}
.empty-state{text-align:center;color:var(--muted);padding:1.5rem;font-size:13px;}

/* PROGRESS */
.prog-item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:.9rem 1rem;margin-bottom:10px;}
.prog-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.prog-name{font-size:14px;font-weight:600;}
.prog-pct{font-size:14px;font-weight:700;}
.prog-bar-bg{background:#e5e7eb;border-radius:20px;height:12px;overflow:hidden;margin-bottom:4px;}
.prog-bar-fill{height:100%;border-radius:20px;transition:width .5s ease;}
.prog-stats{font-size:11px;color:var(--muted);}
.prog-controls{display:flex;gap:6px;margin-top:8px;align-items:center;}
.prog-controls input[type=number]{width:70px;padding:5px 8px;font-size:12px;}
.prog-controls input[type=color]{width:36px;height:32px;padding:2px;border-radius:6px;cursor:pointer;}

/* WEEK */
.week-wrap{overflow-x:auto;padding-bottom:4px;}
.week-grid{display:grid;grid-template-rows:repeat(7,12px);grid-auto-flow:column;grid-auto-columns:12px;gap:2px;width:max-content;}
.wk{width:12px;height:12px;border-radius:2px;background:#e5e7eb;cursor:pointer;transition:all .1s;}
.wk.done{background:var(--accent);}
.wk.today{outline:2px solid var(--amber);outline-offset:1px;}
.week-legend{display:flex;gap:12px;font-size:11px;color:var(--muted);margin-top:6px;align-items:center;}
.week-legend span{display:flex;align-items:center;gap:4px;}
.wl-box{width:10px;height:10px;border-radius:2px;}

/* CALENDAR */
.month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:.75rem;}
.month-label{font-size:15px;font-weight:700;}
.cal-header{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:3px;}
.dow{font-size:11px;color:var(--muted);text-align:center;padding:3px 0;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.day-cell{background:var(--card);border:1px solid var(--border);border-radius:6px;min-height:48px;padding:4px;cursor:pointer;transition:border-color .15s;}
.day-cell:hover{border-color:var(--accent);}
.day-cell.today{border-color:var(--accent);background:var(--accent-light);}
.day-num{font-size:11px;font-weight:500;color:var(--muted);}
.day-cell.today .day-num{color:var(--accent);font-weight:700;}
.day-dot{width:6px;height:6px;border-radius:50%;margin:2px auto 0;}

/* JOURNAL */
.mood-row{display:flex;gap:8px;margin-bottom:.75rem;}
.mood-btn{font-size:20px;padding:6px 10px;border-radius:8px;border:2px solid var(--border);background:var(--card);cursor:pointer;transition:all .15s;}
.mood-btn.selected{border-color:var(--accent);background:var(--accent-light);}
.journal-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:.8rem 1rem;margin-bottom:8px;}
.journal-date{font-size:11px;color:var(--muted);margin-bottom:4px;}
.journal-text{font-size:13px;line-height:1.6;margin-bottom:4px;}
.journal-mood{font-size:16px;}
.journal-done{font-size:11px;color:var(--muted);margin-top:4px;padding-top:4px;border-top:1px solid var(--border);}

/* ALERTS */
.alert-box{border-radius:10px;padding:.85rem 1rem;margin-bottom:.75rem;border-left:4px solid;}
.alert-box.red{background:var(--red-bg);border-color:var(--red);}
.alert-box.amber{background:var(--amber-bg);border-color:var(--amber);}
.alert-box h4{font-size:13px;font-weight:700;margin-bottom:3px;}
.alert-box p{font-size:12px;color:var(--muted);}

/* MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:center;justify-content:center;padding:1rem;}
.overlay.show{display:flex;}
.modal{background:var(--card);border-radius:14px;padding:1.25rem;width:100%;max-width:420px;max-height:88vh;overflow-y:auto;}
.modal h3{font-size:15px;font-weight:700;margin-bottom:1rem;}
.form-row{margin-bottom:.75rem;}
.form-row label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px;}
.modal-btns{display:flex;gap:8px;margin-top:1rem;justify-content:flex-end;}

/* BREAKDOWN */
.bd-step{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px;}
.bd-step:last-child{border-bottom:none;}
.step-num{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.step-time{font-size:11px;color:var(--muted);margin-left:auto;}

/* STAT CARDS */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:1rem;}
.stat-card{background:var(--card);border-radius:10px;padding:.7rem .8rem;text-align:center;border:1px solid var(--border);}
.stat-num{font-size:20px;font-weight:700;}
.stat-label{font-size:10px;color:var(--muted);margin-top:2px;}
</style>
</head>
<body>
<header>
  <h1 id="site-title">🌿 工作管理中心</h1>
  <div style="display:flex;align-items:center;gap:10px">
    <span id="today-label"></span>
    <button onclick="openSettingsModal()" style="background:rgba(255,255,255,0.2);border:none;color:#fff;font-size:18px;width:32px;height:32px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center">⚙️</button>
  </div>
</header>
<div class="tabs">
  <div class="tab active" onclick="switchTab('daily')">每日任務</div>
  <div class="tab" onclick="switchTab('overview')">任務總覽</div>
  <div class="tab" onclick="switchTab('progress')">年度進度</div>
  <div class="tab" onclick="switchTab('monthly')">月曆</div>
  <div class="tab" onclick="switchTab('journal')">工作日誌</div>
  <div class="tab" onclick="switchTab('alerts')">提醒</div>
</div>
<div class="content">
  <div id="tab-daily"></div>
  <div id="tab-overview" style="display:none"></div>
  <div id="tab-progress" style="display:none"></div>
  <div id="tab-monthly" style="display:none"></div>
  <div id="tab-journal" style="display:none"></div>
  <div id="tab-alerts" style="display:none"></div>
</div>

<!-- TASK MODAL -->
<div class="overlay" id="modal-task">
  <div class="modal">
    <h3 id="mt-title">新增任務</h3>
    <div class="form-row"><label>任務名稱</label><input id="mt-name" placeholder="任務名稱"/></div>
    <div class="form-row"><label>性質</label>
      <select id="mt-cat"></select>
    </div>
    <div class="form-row"><label>到期日</label><input id="mt-due" type="date"/></div>
    <div class="form-row"><label>重複週期</label>
      <select id="mt-freq">
        <option value="once">單次</option><option value="daily">每天</option>
        <option value="weekly">每週</option><option value="monthly">每月</option>
        <option value="quarterly">每季</option><option value="yearly">每年</option>
        <option value="triennial">3年</option><option value="quinquennial">5年</option>
      </select>
    </div>
    <div class="form-row"><label>備註／檔案位置</label><textarea id="mt-notes" rows="2" placeholder="負責人、檔案位置..."></textarea></div>
    <div class="form-row"><label>筆記（停用原因、特殊說明等）</label><textarea id="mt-memo" rows="2" placeholder="例：此文件已停用、改由南行政負責、某年後不再更新..."></textarea></div>
    <div class="form-row"><label>狀態</label>
      <select id="mt-status">
        <option value="active">正常追蹤</option>
        <option value="paused">暫停（不顯示在每日任務）</option>
        <option value="obsolete">已停用（保留紀錄）</option>
      </select>
    </div>
    <div class="modal-btns">
      <button class="btn btn-ghost" onclick="closeModal('modal-task')">取消</button>
      <button class="btn btn-primary" onclick="saveTask()">儲存</button>
    </div>
  </div>
</div>

<!-- DONE MODAL（只有單次任務才會開） -->
<div class="overlay" id="modal-done">
  <div class="modal">
    <h3>✅ 任務完成！</h3>
    <p style="font-size:13px;font-weight:500;margin-bottom:1rem;" id="done-name"></p>
    <div class="form-row"><label>這個任務下次還需要做嗎？</label>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:4px">
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;color:var(--text)">
          <input type="radio" name="done-repeat" value="no" checked onclick="toggleRepeatFields(false)" style="width:auto;accent-color:var(--accent)"/>
          不需要，這次完成就好
        </label>
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;color:var(--text)">
          <input type="radio" name="done-repeat" value="yes" onclick="toggleRepeatFields(true)" style="width:auto;accent-color:var(--accent)"/>
          需要，幫我設下次日期和週期
        </label>
      </div>
    </div>
    <div id="done-next-block" style="display:none">
      <div class="form-row"><label>下次日期</label><input id="done-next" type="date"/></div>
      <div class="form-row"><label>重複週期</label>
        <select id="done-freq">
          <option value="monthly">每月</option>
          <option value="quarterly">每季</option>
          <option value="yearly">每年</option>
          <option value="triennial">3年</option>
          <option value="quinquennial">5年</option>
          <option value="weekly">每週</option>
          <option value="once">單次（不再重複）</option>
        </select>
      </div>
    </div>
    <div class="modal-btns">
      <button class="btn btn-ghost" onclick="closeModal('modal-done')">跳過</button>
      <button class="btn btn-primary" onclick="confirmDone()">確認</button>
    </div>
  </div>
</div>

<!-- SETTINGS MODAL -->
<div class="overlay" id="modal-settings">
  <div class="modal">
    <h3>⚙️ 個人設定</h3>
    <div class="form-row"><label>您的暱稱</label><input id="set-name" placeholder="例：巧巧、Mibo" /></div>
    <div class="form-row">
      <label>主題顏色</label>
      <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:6px" id="theme-picker">
        <div onclick="setTheme('green')" title="森林綠" style="height:36px;border-radius:8px;background:#3d6b4f;cursor:pointer;border:3px solid transparent" id="theme-green"></div>
        <div onclick="setTheme('blue')" title="海洋藍" style="height:36px;border-radius:8px;background:#1d4ed8;cursor:pointer;border:3px solid transparent" id="theme-blue"></div>
        <div onclick="setTheme('purple')" title="薰衣草紫" style="height:36px;border-radius:8px;background:#6d28d9;cursor:pointer;border:3px solid transparent" id="theme-purple"></div>
        <div onclick="setTheme('rose')" title="玫瑰粉" style="height:36px;border-radius:8px;background:#be185d;cursor:pointer;border:3px solid transparent" id="theme-rose"></div>
        <div onclick="setTheme('orange')" title="活力橘" style="height:36px;border-radius:8px;background:#c2410c;cursor:pointer;border:3px solid transparent" id="theme-orange"></div>
        <div onclick="setTheme('teal')" title="青綠" style="height:36px;border-radius:8px;background:#0f766e;cursor:pointer;border:3px solid transparent" id="theme-teal"></div>
        <div onclick="setTheme('slate')" title="石板灰" style="height:36px;border-radius:8px;background:#334155;cursor:pointer;border:3px solid transparent" id="theme-slate"></div>
        <div onclick="setTheme('amber')" title="暖金黃" style="height:36px;border-radius:8px;background:#92400e;cursor:pointer;border:3px solid transparent" id="theme-amber"></div>
        <div onclick="setTheme('indigo')" title="靛藍" style="height:36px;border-radius:8px;background:#3730a3;cursor:pointer;border:3px solid transparent" id="theme-indigo"></div>
        <div onclick="setTheme('custom')" title="自訂" style="height:36px;border-radius:8px;background:linear-gradient(135deg,#f43f5e,#8b5cf6,#06b6d4);cursor:pointer;border:3px solid transparent;display:flex;align-items:center;justify-content:center;font-size:16px" id="theme-custom">🎨</div>
      </div>
      <div id="custom-color-row" style="display:none;margin-top:8px;display:flex;align-items:center;gap:8px">
        <label style="font-size:12px;color:var(--muted)">自訂色</label>
        <input type="color" id="custom-color-pick" value="#3d6b4f" style="width:48px;height:32px;padding:2px;border-radius:6px;cursor:pointer;border:1px solid var(--border)" oninput="applyCustomColor(this.value)"/>
      </div>
    </div>
    <div class="form-row" style="margin-top:.5rem">
      <label>手機通知</label>
      <button id="notif-btn" class="btn btn-ghost" style="width:100%;margin-top:4px" onclick="toggleNotification()">載入中...</button>
    </div>
    <div class="modal-btns">
      <button class="btn btn-ghost" onclick="closeModal('modal-settings')">取消</button>
      <button class="btn btn-primary" onclick="saveSettings()">儲存</button>
    </div>
  </div>
</div>

<!-- WELCOME MODAL -->
<div class="overlay" id="modal-welcome">
  <div class="modal">
    <h3>👋 歡迎使用！</h3>
    <p style="font-size:13px;color:var(--muted);margin-bottom:1rem">請問怎麼稱呼您？之後會顯示在標題上</p>
    <div class="form-row"><input id="welcome-name" placeholder="例：巧巧、Mibo..." onkeydown="if(event.key==='Enter')saveWelcome()"/></div>
    <div class="modal-btns">
      <button class="btn btn-ghost" onclick="skipWelcome()">跳過</button>
      <button class="btn btn-primary" onclick="saveWelcome()">確認</button>
    </div>
  </div>
</div>

<!-- BREAKDOWN MODAL -->
<div class="overlay" id="modal-bd">
  <div class="modal">
    <h3>🔧 任務拆解</h3>
    <p style="font-size:13px;font-weight:500;margin-bottom:.5rem;" id="bd-name"></p>
    <p style="font-size:12px;color:var(--muted);margin-bottom:.75rem;">一步一步來，不要急：</p>
    <div id="bd-steps"></div>
    <div class="modal-btns"><button class="btn btn-primary" onclick="closeModal('modal-bd');renderDaily()">好，我知道了！</button></div>
  </div>
</div>



<!-- JOURNAL MODAL -->
<div class="overlay" id="modal-journal">
  <div class="modal">
    <h3>📝 今日工作日誌</h3>
    <div class="form-row"><label>心情</label>
      <div class="mood-row" id="mood-picker">
        <button class="mood-btn" data-mood="😄" onclick="selectMood('😄',this)">😄</button>
        <button class="mood-btn" data-mood="🙂" onclick="selectMood('🙂',this)">🙂</button>
        <button class="mood-btn" data-mood="😐" onclick="selectMood('😐',this)">😐</button>
        <button class="mood-btn" data-mood="😔" onclick="selectMood('😔',this)">😔</button>
        <button class="mood-btn" data-mood="😤" onclick="selectMood('😤',this)">😤</button>
      </div>
    </div>
    <div class="form-row">
      <label>今日完成任務（自動抓取）</label>
      <div id="jt-auto-done" style="background:var(--bg);border-radius:8px;padding:10px;min-height:48px;font-size:13px;color:var(--text);border:1px solid var(--border);line-height:1.8"></div>
    </div>
    <div class="form-row"><label>備註 / 想法 / 明天注意</label><textarea id="jt-note" rows="3" placeholder="困難、想法、明天要注意的事..."></textarea></div>
    <div class="modal-btns">
      <button class="btn btn-ghost" onclick="closeModal('modal-journal')">取消</button>
      <button class="btn btn-primary" onclick="saveJournal()">儲存日誌</button>
    </div>
  </div>
</div>

<script>
// ===== GLOBALS =====
const TODAY = new Date(); TODAY.setHours(0,0,0,0);
const DAYS = ['日','一','二','三','四','五','六'];
const FREQ_LABEL = {once:'單次',daily:'每天',weekly:'每週',monthly:'每月',quarterly:'每季',yearly:'每年',triennial:'3年',quinquennial:'5年'};
const CAT_COLOR = {文件:'blue',會議:'amber',稽核:'red',校正:'amber',報告:'blue',合約:'green',其他:'gray'};
const BREAKDOWNS = {
  會議:['確認上次會議記錄','準備本次議程與資料','通知與會人員','主持/出席會議','撰寫會議記錄並存檔'],
  稽核:['調出上次稽核報告','確認稽核範圍與表單','現場稽核/資料審查','填寫稽核記錄','存檔並回報主管'],
  校正:['確認儀器清單與上次記錄','聯繫廠商或準備內校工具','進行校正作業','更新貼紙/計畫表','存放校正報告並歸檔'],

// ===== UTILS =====
function fmt(s){ return s?s.replace(/-/g,'/'):'—'; }
function dLeft(due){
  if(!due) return null;
  const d=new Date(due); d.setHours(0,0,0,0);
  return Math.round((d-TODAY)/86400000);
}
function statusBadge(d){
  if(d===null) return '';
  if(d<0) return `<span class="badge badge-red">過期${Math.abs(d)}天</span>`;
  if(d===0) return `<span class="badge badge-red">今天到期</span>`;
  if(d<=7) return `<span class="badge badge-red">剩${d}天</span>`;
  if(d<=30) return `<span class="badge badge-amber">剩${d}天</span>`;
  if(d<=90) return `<span class="badge badge-amber">剩${d}天</span>`;
  return `<span class="badge badge-green">剩${d}天</span>`;
}
function catBadge(c){ const cl=CAT_COLOR[c]||'gray'; return `<span class="badge badge-${cl}">${c}</span>`; }
function freqBadge(f){ return `<span class="badge badge-gray">${FREQ_LABEL[f]||f}</span>`; }
function nextDue(from,freq){
  const d=new Date(from);
  if(freq==='daily') d.setDate(d.getDate()+1);
  else if(freq==='weekly') d.setDate(d.getDate()+7);
  else if(freq==='monthly') d.setMonth(d.getMonth()+1);
  else if(freq==='quarterly') d.setMonth(d.getMonth()+3);
  else if(freq==='yearly') d.setFullYear(d.getFullYear()+1);
  else if(freq==='triennial') d.setFullYear(d.getFullYear()+3);
  else if(freq==='quinquennial') d.setFullYear(d.getFullYear()+5);
  return d.toISOString().split('T')[0];
}
function todayStr(){ return TODAY.toISOString().split('T')[0]; }

// ===== OVERVIEW =====
function renderOverview(){
  const FREQ_ORDER={once:0,daily:1,weekly:2,monthly:3,quarterly:4,yearly:5,triennial:6,quinquennial:7};
  const FREQ_MAP={'全部':'all','單次':'once','每天':'daily','每週':'weekly','每月':'monthly','每季':'quarterly','每年':'yearly','3年':'triennial','5年':'quinquennial'};

  // 年份選項：從任務中取得所有年份
  const allYears=[...new Set(tasks.map(t=>t.due?t.due.slice(0,4):null).filter(Boolean))].sort();
  const curYear=String(TODAY.getFullYear());

  let filterYear=window._ovYear||curYear;
  let filterCat=window._ovCat||'全部';
  let filterFreq=window._ovFreq||'全部';
  let filterStatus=window._ovStatus||'全部';
  let sortBy=window._ovSort||'due';

  // 取得目前年份任務的所有性質
  const yearTasks=tasks.filter(t=>!t.due||t.due.startsWith(filterYear)||filterYear==='全部');
  const allCatsInYear=['全部',...new Set(yearTasks.map(t=>t.cat).filter(Boolean))];
  const freqs=['全部','單次','每月','每季','每年','3年','5年'];

  // 篩選
  let filtered=[...tasks];
  // 年份篩選：顯示該年有到期的任務（due 在該年，或無到期日全顯示）
  if(filterYear!=='全部'){
    filtered=filtered.filter(t=>t.due&&t.due.startsWith(filterYear));
  }
  if(filterCat!=='全部') filtered=filtered.filter(t=>t.cat===filterCat);
  if(filterFreq!=='全部') filtered=filtered.filter(t=>t.freq===(FREQ_MAP[filterFreq]||filterFreq));
  if(filterStatus==='待完成') filtered=filtered.filter(t=>!t.done);
  else if(filterStatus==='已完成') filtered=filtered.filter(t=>t.done);
  else if(filterStatus==='過期') filtered=filtered.filter(t=>!t.done&&dLeft(t.due)!==null&&dLeft(t.due)<0);
  else if(filterStatus==='30天內') filtered=filtered.filter(t=>!t.done&&dLeft(t.due)!==null&&dLeft(t.due)>=0&&dLeft(t.due)<=30);
  else if(filterStatus==='暫停') filtered=filtered.filter(t=>t.status==='paused');
  else if(filterStatus==='停用') filtered=filtered.filter(t=>t.status==='obsolete');

  if(sortBy==='due') filtered.sort((a,b)=>(dLeft(a.due)??99999)-(dLeft(b.due)??99999));
  else if(sortBy==='name') filtered.sort((a,b)=>a.name.localeCompare(b.name));
  else if(sortBy==='cat') filtered.sort((a,b)=>a.cat.localeCompare(b.cat));
  else if(sortBy==='freq') filtered.sort((a,b)=>(FREQ_ORDER[a.freq]||0)-(FREQ_ORDER[b.freq]||0));

  const yearBase=filterYear==='全部'?tasks:tasks.filter(t=>t.due&&t.due.startsWith(filterYear));
  const total=yearBase.length;
  const doneCount=yearBase.filter(t=>t.done).length;
  const expCount=yearBase.filter(t=>!t.done&&dLeft(t.due)!==null&&dLeft(t.due)<0).length;
  const s30=yearBase.filter(t=>!t.done&&dLeft(t.due)!==null&&dLeft(t.due)>=0&&dLeft(t.due)<=30).length;

  function pill(label,active,onclick){
    return `<button onclick="${onclick}" style="font-family:inherit;font-size:11px;padding:4px 10px;border-radius:20px;border:1px solid ${active?'var(--accent)':'var(--border)'};background:${active?'var(--accent-light)':'transparent'};color:${active?'var(--accent)':'var(--muted)'};cursor:pointer;white-space:nowrap">${label}</button>`;
  }

  const rows=filtered.map(t=>{
    const d=dLeft(t.due);
    const statusDot=t.done?'✅':t.status==='obsolete'?'⛔':t.status==='paused'?'⏸':d===null?'⚪':d<0?'🔴':d<=7?'🔴':d<=30?'🟡':d<=90?'🟡':'🟢';
    const rowStyle=t.status==='obsolete'?'opacity:.5':'';
    return `<tr style="border-bottom:1px solid var(--border);${rowStyle}">
      <td style="padding:7px 6px;font-size:12px;font-weight:500;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${t.name}${t.memo?' | 筆記：'+t.memo:''}">${statusDot} ${t.name}${t.memo?` <span style="color:var(--purple);font-size:10px">💬</span>`:''}</td>
      <td style="padding:7px 6px">${catBadge(t.cat)}</td>
      <td style="padding:7px 6px">${freqBadge(t.freq)}</td>
      <td style="padding:7px 6px;font-size:11px;color:var(--muted);white-space:nowrap">${t.due?fmt(t.due):'—'}</td>
      <td style="padding:7px 6px">${t.status==='obsolete'?'<span class="badge badge-gray">停用</span>':t.status==='paused'?'<span class="badge badge-amber">暫停</span>':statusBadge(d)}</td>
      <td style="padding:7px 6px">
        <button class="btn btn-ghost btn-sm" onclick="openEditTask(${t.id})">編輯</button>
      </td>
    </tr>`;
  }).join('');

  document.getElementById('tab-overview').innerHTML=`
    <div style="margin-top:.5rem;margin-bottom:.75rem">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <span style="font-size:13px;font-weight:600">📅 年份</span>
        ${['全部',...allYears].map(y=>pill(y,filterYear===y,`window._ovYear='${y}';window._ovCat='全部';renderOverview()`)).join('')}
      </div>
    </div>

    <div class="stat-grid">
      <div class="stat-card"><div class="stat-num">${total}</div><div class="stat-label">${filterYear==='全部'?'全部':''+filterYear+'年'} 任務</div></div>
      <div class="stat-card"><div class="stat-num" style="color:var(--red)">${expCount}</div><div class="stat-label">已過期</div></div>
      <div class="stat-card"><div class="stat-num" style="color:var(--amber)">${s30}</div><div class="stat-label">30天內</div></div>
      <div class="stat-card"><div class="stat-num" style="color:var(--green)">${doneCount}</div><div class="stat-label">已完成</div></div>
    </div>

    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:7px;align-items:center">
      <span style="font-size:11px;color:var(--muted)">狀態</span>
      ${['全部','待完成','已完成','過期','30天內','暫停','停用'].map(s=>pill(s,filterStatus===s,`window._ovStatus='${s}';renderOverview()`)).join('')}
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:7px;align-items:center">
      <span style="font-size:11px;color:var(--muted)">性質</span>
      ${allCatsInYear.map(c=>pill(c,filterCat===c,`window._ovCat='${c}';renderOverview()`)).join('')}
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:7px;align-items:center">
      <span style="font-size:11px;color:var(--muted)">排序</span>
      ${[['due','到期日'],['name','名稱'],['cat','性質'],['freq','週期']].map(([v,l])=>pill(l,sortBy===v,`window._ovSort='${v}';renderOverview()`)).join('')}
    </div>

    <div style="font-size:11px;color:var(--muted);margin-bottom:6px">共 ${filtered.length} 筆</div>
    <div style="overflow-x:auto">
      <table style="width:100%;border-collapse:collapse;min-width:480px">
        <thead>
          <tr style="border-bottom:2px solid var(--border)">
            <th style="text-align:left;font-size:11px;color:var(--muted);padding:5px 6px;font-weight:500">任務名稱</th>
            <th style="text-align:left;font-size:11px;color:var(--muted);padding:5px 6px;font-weight:500">性質</th>
            <th style="text-align:left;font-size:11px;color:var(--muted);padding:5px 6px;font-weight:500">週期</th>
            <th style="text-align:left;font-size:11px;color:var(--muted);padding:5px 6px;font-weight:500">到期日</th>
            <th style="text-align:left;font-size:11px;color:var(--muted);padding:5px 6px;font-weight:500">狀態</th>
            <th style="text-align:left;font-size:11px;color:var(--muted);padding:5px 6px;font-weight:500"></th>
          </tr>
        </thead>
        <tbody>${rows||'<tr><td colspan="6" style="text-align:center;padding:1.5rem;color:var(--muted);font-size:13px">沒有符合的任務</td></tr>'}</tbody>
      </table>
    </div>
  `;
}

// ===== DAILY =====
function renderDaily(){
  const sorted=[...tasks].sort((a,b)=>(dLeft(a.due)??9999)-(dLeft(b.due)??9999));
  const isActive=t=>!t.status||t.status==='active';
  const overdue=sorted.filter(t=>!t.done&&isActive(t)&&dLeft(t.due)!==null&&dLeft(t.due)<0);
  const todayT=sorted.filter(t=>!t.done&&isActive(t)&&dLeft(t.due)===0);
  const upcoming=sorted.filter(t=>!t.done&&isActive(t)&&dLeft(t.due)!==null&&dLeft(t.due)>0);
  const doneT=sorted.filter(t=>t.done);

  const urgent=[...overdue,...todayT];
  let alertH='';
  if(urgent.length) alertH=`<div class="alert-box red"><h4>⚠️ ${urgent.length}件需要立即處理</h4><p>${urgent.slice(0,3).map(t=>t.name).join('、')}${urgent.length>3?'...':''}</p></div>`;

  function tcard(t){
    const d=dLeft(t.due);
    const isSel=batchSelected.has(t.id);
    return `<div class="task-card ${t.done?'done':''}" style="${batchMode?'cursor:pointer':''}${isSel?';background:var(--red-bg);border-color:#fca5a5':''}" onclick="${batchMode?`toggleBatchSelect(${t.id})`:''}">
      ${batchMode
        ? `<div style="width:20px;height:20px;border-radius:4px;border:2px solid ${isSel?'var(--red)':'var(--border)'};background:${isSel?'var(--red)':'transparent'};flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:2px">${isSel?'<span style="color:#fff;font-size:12px">✓</span>':''}</div>`
        : `<div class="chk ${t.done?'on':''}" onclick="event.stopPropagation();toggleDone(${t.id})"></div>`
      }
      <div class="tbody">
        <div class="tname">${t.name}</div>
        <div class="tmeta">${catBadge(t.cat)}${freqBadge(t.freq)}
          ${t.status==='paused'?'<span class="badge badge-amber">暫停</span>':''}
          ${t.status==='obsolete'?'<span class="badge badge-gray">已停用</span>':''}
          ${t.due?`<span style="font-size:10px;color:var(--muted)">${fmt(t.due)}</span>`:''}
          ${statusBadge(d)}
          ${t.notes?`<span title="${t.notes}" style="font-size:11px;cursor:help">📝</span>`:''}
          ${t.memo?`<span title="${t.memo}" style="font-size:11px;cursor:help;color:var(--purple)">💬</span>`:''}
        </div>
      </div>
      ${!batchMode?`<div class="tacts">
        <button class="btn btn-ghost btn-sm" onclick="openEditTask(${t.id})">編輯</button>
        <button class="btn btn-danger btn-sm" onclick="delTask(${t.id})">刪除</button>
      </div>`:''}
    </div>`;
  }

  // Stats
  const exp=tasks.filter(t=>!t.done&&dLeft(t.due)!==null&&dLeft(t.due)<0).length;
  const s30=tasks.filter(t=>!t.done&&dLeft(t.due)!==null&&dLeft(t.due)>=0&&dLeft(t.due)<=30).length;
  const doneCount=tasks.filter(t=>t.done).length;
  const total=tasks.length;

  document.getElementById('tab-daily').innerHTML=`
    <div class="stat-grid" style="margin-top:.5rem">
      <div class="stat-card"><div class="stat-num" style="color:var(--red)">${exp}</div><div class="stat-label">已過期</div></div>
      <div class="stat-card"><div class="stat-num" style="color:var(--amber)">${s30}</div><div class="stat-label">30天內</div></div>
      <div class="stat-card"><div class="stat-num" style="color:var(--green)">${doneCount}</div><div class="stat-label">已完成</div></div>
      <div class="stat-card"><div class="stat-num">${total}</div><div class="stat-label">全部任務</div></div>
    </div>
    ${alertH}
    <div class="add-bar">
      <input id="quick-name" placeholder="快速新增任務..." onkeydown="if(event.key==='Enter')quickAdd()"/>
      <select id="quick-freq">
        <option value="once">單次</option><option value="monthly">每月</option>
        <option value="quarterly">每季</option><option value="yearly">每年</option>
        <option value="triennial">3年</option><option value="quinquennial">5年</option>
      </select>
      <button class="btn btn-primary" onclick="quickAdd()">＋</button>
    </div>
    <button class="btn btn-ghost" style="width:100%;margin-bottom:.5rem;font-size:12px" onclick="openNewTask()">＋ 完整新增（含到期日/性質/備註）</button>
    <button class="btn btn-ghost" style="width:100%;margin-bottom:.75rem;font-size:12px;color:var(--red)" onclick="toggleBatchMode()">🗑 批量刪除</button>
    <div id="batch-bar" style="display:none;background:var(--red-bg);border:1px solid #fca5a5;border-radius:10px;padding:.6rem 1rem;margin-bottom:.75rem;display:none;align-items:center;justify-content:space-between">
      <span id="batch-count" style="font-size:13px;color:var(--red)">已選 0 件</span>
      <div style="display:flex;gap:8px">
        <button class="btn btn-ghost btn-sm" onclick="selectAllTasks()">全選</button>
        <button class="btn btn-danger btn-sm" onclick="confirmBatchDelete()">確定刪除</button>
        <button class="btn btn-ghost btn-sm" onclick="cancelBatchMode()">取消</button>
      </div>
    </div>
    ${overdue.length?`<div class="section-title" style="color:var(--red)">已過期</div>${overdue.map(tcard).join('')}`:''}
    ${todayT.length?`<div class="section-title" style="color:var(--amber)">今天到期</div>${todayT.map(tcard).join('')}`:''}
    ${upcoming.length?`<div class="section-title">即將到期</div>${upcoming.map(tcard).join('')}`:''}
    ${doneT.length?`<div class="section-title">已完成</div>${doneT.map(tcard).join('')}`:''}
    ${!tasks.length?`<div class="empty-state">目前沒有任務，按上方新增吧！</div>`:''}
  `;
}

function saveTask(){
  const name=document.getElementById('mt-name').value.trim();
  if(!name) return alert('請填寫任務名稱');
  const t={id:editTaskId||Date.now(),name,cat:document.getElementById('mt-cat').value,
    due:document.getElementById('mt-due').value,freq:document.getElementById('mt-freq').value,
    notes:document.getElementById('mt-notes').value,
    memo:document.getElementById('mt-memo').value,
    status:document.getElementById('mt-status').value,
    done:false};
  if(editTaskId){ const i=tasks.findIndex(x=>x.id===editTaskId); tasks[i]=t; }
  else tasks.push(t);
  save('tasks'); closeModal('modal-task'); renderDaily();
}
function delTask(id){
  if(!confirm('確定刪除？')) return;
  tasks=tasks.filter(x=>x.id!==id); save('tasks'); renderDaily();
}

function toggleDone(id){
  const t=tasks.find(x=>x.id===id); if(!t) return;
  if(t.done){
    // 取消完成：年度進度 -1
    syncProg(t.cat,-1);
    t.done=false; t.doneDate=null;
    save('tasks'); renderDaily(); return;
  }
  doneTaskId=id;
  document.getElementById('done-name').textContent=t.name;

  if(t.freq==='once'){
    // 單次：詢問是否重複
    document.getElementById('done-repeat-block').style.display='block';
    document.getElementById('done-next-block').style.display='none';
    document.querySelectorAll('input[name=done-repeat]').forEach(r=>{ r.checked=r.value==='no'; });
    document.getElementById('done-next').value=todayStr();
    document.getElementById('done-freq').value='monthly';
    openModal('modal-done');
  } else {
    // 有週期：靜默自動建下次，不彈視窗
    t.done=true; t.doneDate=todayStr();
    syncProg(t.cat,+1);
    const nextDate=nextDue(t.due||todayStr(),t.freq);
    tasks.push({id:Date.now()+1,name:t.name,cat:t.cat,due:nextDate,freq:t.freq,notes:t.notes,done:false});
    save('tasks');
    showToast(`✅ 完成！下次 ${fmt(nextDate)} 已自動排入`);
    renderDaily();
  }
}

function confirmDone(){
  const t=tasks.find(x=>x.id===doneTaskId); if(!t) return;
  t.done=true; t.doneDate=todayStr();
  syncProg(t.cat,+1);

  const wantRepeat=document.querySelector('input[name=done-repeat]:checked')?.value==='yes';
  if(wantRepeat){
    const nextDate=document.getElementById('done-next').value;
    const newFreq=document.getElementById('done-freq').value;
    if(nextDate){
      tasks.push({id:Date.now()+1,name:t.name,cat:t.cat,due:nextDate,freq:newFreq,notes:t.notes,done:false});
      save('tasks'); closeModal('modal-done');
      showToast('✅ 完成！下次 '+fmt(nextDate)+' 已排入');
      renderDaily(); return;
    }
  }
  save('tasks'); closeModal('modal-done');
  showToast('✅ 任務完成！');
  renderDaily();
}

const CAT_COLOR_MAP={
  文件:'#2563eb',會議:'#d97706',稽核:'#dc2626',校正:'#e97316',
  報告:'#7c3aed',合約:'#16a34a',其他:'#888',
};
function getCatColor(cat){
  if(CAT_COLOR_MAP[cat]) return CAT_COLOR_MAP[cat];
  // 自訂性質給隨機固定色
  const palette=['#0891b2','#be185d','#854d0e','#166534','#1e3a8a','#6b21a8','#9f1239'];
  let hash=0; for(let c of cat) hash=(hash*31+c.charCodeAt(0))%palette.length;
  return palette[hash];
}

function renderProgress(){
  const curYear=TODAY.getFullYear();
  const year=window._progYear||curYear;
  const yearStr=String(year);
  const weekNum=Math.ceil((((TODAY-new Date(curYear,0,1))/86400000)+new Date(curYear,0,1).getDay()+1)/7);

  // 年份選擇列
  const allProgYears=[...new Set([
    ...tasks.map(t=>t.doneDate?t.doneDate.slice(0,4):null).filter(Boolean),
    String(curYear), String(curYear+1)
  ])].sort();
  function pill(label,active,onclick){
    return `<button onclick="${onclick}" style="font-family:inherit;font-size:11px;padding:4px 12px;border-radius:20px;border:1px solid ${active?'var(--accent)':'var(--border)'};background:${active?'var(--accent-light)':'transparent'};color:${active?'var(--accent)':'var(--muted)'};cursor:pointer;white-space:nowrap">${label}</button>`;
  }
  const yearPickerH=`<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:.75rem">
    <span style="font-size:11px;color:var(--muted)">年份</span>
    ${allProgYears.map(y=>pill(y,String(year)===y,`window._progYear=${y};renderProgress()`)).join('')}
  </div>`;

  // 52週 grid（只顯示當年）
  let weekH='<div class="week-wrap"><div class="week-grid">';
  for(let w=1;w<=52;w++){
    const key=`${year}_${w}`;
    const isDone=(weekDone||[]).includes(key)||(year===curYear&&(weekDone||[]).includes(w));
    const isTod=w===weekNum&&year===curYear;
    weekH+=`<div class="wk ${isDone?'done':''} ${isTod?'today':''}" onclick="toggleWeek(${w},${year})" title="第${w}週"></div>`;
  }
  weekH+=`</div></div>
  <div class="week-legend">
    <span><div class="wl-box" style="background:var(--accent)"></div>已完成</span>
    <span><div class="wl-box" style="background:#e5e7eb;outline:2px solid var(--amber);outline-offset:1px"></div>本週</span>
    <span style="color:var(--muted)">第${weekNum}週 / 共52週（${year}年）</span>
  </div>`;

  // 性質進度條
  // 合併：customCats + 任務裡有但不在清單的性質
  const taskCats=[...new Set(tasks.map(t=>t.cat))].filter(Boolean);
  const allCats=[...new Set([...customCats,...taskCats])].filter(c=>c!=='其他');
  // 「其他」單獨列在最後，標示為不計入統計
  const hasOther=tasks.some(t=>t.cat==='其他');

  const progH=allCats.filter(cat=>cat!=='其他').map(cat=>{
    const catTasks=tasks.filter(t=>t.cat===cat);
    const total=catTasks.length;
    const done=catTasks.filter(t=>t.done&&t.doneDate&&t.doneDate.startsWith(yearStr)).length;
    const pct=total>0?Math.round((done/total)*100):0;
    const color=getCatColor(cat);
    const pendingAll=catTasks.filter(t=>!t.done);
    const doneAll=catTasks.filter(t=>t.done&&t.doneDate&&t.doneDate.startsWith(yearStr));
    const isCustom=customCats.includes(cat);
    const expandId='expand_'+cat.replace(/[^a-zA-Z0-9]/g,'_');
    return `<div class="prog-item">
      <div class="prog-header">
        <span class="prog-name" style="color:${color}">${cat}</span>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="prog-pct" style="color:${color}">${pct}%</span>
          <button onclick="toggleExpand('${expandId}')" style="font-size:11px;padding:2px 9px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-family:inherit" id="btn_${expandId}">展開 ▼</button>
          ${isCustom&&cat!=='其他'?`<button onclick="removeCat('${cat}')" style="font-size:10px;padding:2px 7px;border-radius:6px;border:1px solid #fca5a5;background:var(--red-bg);color:var(--red);cursor:pointer;font-family:inherit">移除</button>`:''}
        </div>
      </div>
      <div class="prog-bar-bg"><div class="prog-bar-fill" style="width:${pct}%;background:${color}"></div></div>
      <div style="margin-top:4px;display:flex;gap:12px">
        <span class="prog-stats">待完成 ${pendingAll.length} 件</span>
        <span class="prog-stats" style="color:var(--green)">今年已完成 ${done} 件</span>
        <span class="prog-stats">共 ${total} 件</span>
      </div>
      <div id="${expandId}" style="display:none;margin-top:8px;border-top:1px solid var(--border);padding-top:8px">
        ${pendingAll.length?`
          <div style="font-size:11px;font-weight:500;color:var(--red);margin-bottom:4px">⏳ 待完成（${pendingAll.length}）</div>
          ${pendingAll.map(t=>`<div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:4px 0;border-bottom:1px solid var(--border)">
            <span style="flex:1;${t.status==='obsolete'?'text-decoration:line-through;color:var(--muted)':''}">${t.name}${t.memo?` <span style="font-size:10px;color:var(--purple)" title="${t.memo}">💬</span>`:''}</span>
            <span style="color:var(--muted);font-size:11px;white-space:nowrap;margin-left:8px">${t.due?fmt(t.due):''}</span>
            ${t.status==='obsolete'?'<span style="font-size:10px;padding:1px 5px;background:var(--bg);border-radius:4px;color:var(--muted);margin-left:4px">停用</span>':''}
            ${t.status==='paused'?'<span style="font-size:10px;padding:1px 5px;background:var(--amber-bg);border-radius:4px;color:var(--amber);margin-left:4px">暫停</span>':''}
          </div>`).join('')}`:''}
        ${doneAll.length?`
          <div style="font-size:11px;font-weight:500;color:var(--green);margin:8px 0 4px">✅ 今年已完成（${doneAll.length}）</div>
          ${doneAll.map(t=>`<div style="font-size:12px;padding:3px 0;color:var(--muted);text-decoration:line-through">${t.name}</div>`).join('')}`:''}
      </div>
    </div>`;
  }).join('') || '<div class="empty-state">還沒有任何任務</div>';

  // 新增性質
  const addCatH=`<div style="display:flex;gap:8px;margin-top:.5rem">
    <input id="new-cat-input" placeholder="新增性質名稱..." style="flex:1;font-size:13px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text)" onkeydown="if(event.key==='Enter')addCat()"/>
    <button class="btn btn-primary" onclick="addCat()">＋新增</button>
  </div>`;

  // 「其他」區塊
  const otherTasks=tasks.filter(t=>t.cat==='其他');
  const otherH=otherTasks.length?`
    <div class="prog-item" style="opacity:.65;margin-top:.5rem">
      <div class="prog-header">
        <span class="prog-name" style="color:var(--muted)">其他（日常瑣事）</span>
        <span style="font-size:11px;padding:2px 8px;border-radius:20px;background:var(--bg);color:var(--muted);border:1px solid var(--border)">不計入統計</span>
      </div>
      <div style="font-size:11px;color:var(--muted);margin-top:4px">共 ${otherTasks.filter(t=>!t.done).length} 件待完成，${otherTasks.filter(t=>t.done).length} 件已完成</div>
    </div>`:'';

  document.getElementById('tab-progress').innerHTML=`
    ${yearPickerH}
    <div class="section-title" style="margin-top:.25rem">52週進度 — ${year}年</div>
    ${weekH}
    <div class="section-title" style="margin-top:1.25rem">年度完成進度（依性質）— ${year}年</div>
    ${progH}
    ${otherH}
    <div style="margin-top:.75rem;padding-top:.75rem;border-top:1px solid var(--border)">
      <div style="font-size:12px;color:var(--muted);margin-bottom:6px">新增性質類別</div>
      ${addCatH}
    </div>
  `;
}

function addCat(){
  const input=document.getElementById('new-cat-input');
  const name=input.value.trim();
  if(!name) return;
  if(customCats.includes(name)){ showToast('已有這個性質'); return; }
  customCats.push(name);
  saveCats();
  input.value='';
  renderProgress();
  showToast(`✅「${name}」已新增，任務性質選單同步更新`);
}

function removeCat(cat){
  if(cat==='其他'){ showToast('「其他」為保留性質，無法移除'); return; }
  if(!confirm(`確定移除「${cat}」性質？（任務不會被刪除）`)) return;
  customCats=customCats.filter(c=>c!==cat);
  saveCats();
  renderProgress();
  showToast(`🗑「${cat}」已移除，任務性質選單同步更新`);
}

function toggleWeek(w, year){
  const curYear=TODAY.getFullYear();
  const key=(year&&year!==curYear)?`${year}_${w}`:w;
  const i=weekDone.indexOf(key);
  if(i>-1) weekDone.splice(i,1); else weekDone.push(key);
  save('week'); renderProgress();
}

function renderCalendar(){
  const y=calMonth.getFullYear(), m=calMonth.getMonth();
  document.getElementById('tab-monthly').innerHTML=`
    <div class="month-nav">
      <button class="btn btn-ghost btn-sm" onclick="chgMonth(-1)">◀</button>
      <span class="month-label">${y}年${m+1}月</span>
      <button class="btn btn-ghost btn-sm" onclick="chgMonth(1)">▶</button>
    </div>
    <div class="cal-header">${['日','一','二','三','四','五','六'].map(d=>`<div class="dow">${d}</div>`).join('')}</div>
    <div class="cal-grid" id="cal-grid"></div>
    <div class="section-title" id="cal-day-label" style="margin-top:1rem">點選日期查看任務</div>
    <div id="cal-day-tasks"></div>
  `;
  const firstDay=new Date(y,m,1).getDay();
  const daysInMonth=new Date(y,m+1,0).getDate();
  const taskMap={};
  tasks.filter(t=>!t.done&&t.due&&t.due.startsWith(`${y}-${String(m+1).padStart(2,'0')}`)).forEach(t=>{
    const d=parseInt(t.due.split('-')[2]);
    if(!taskMap[d]) taskMap[d]=[];
    taskMap[d].push(t);
  });
  let html='';
  for(let i=0;i<firstDay;i++) html+='<div></div>';
  for(let d=1;d<=daysInMonth;d++){
    const ts=taskMap[d]||[];
    const isToday=new Date(y,m,d).toDateString()===TODAY.toDateString();
    const minD=ts.length?Math.min(...ts.map(t=>dLeft(t.due))):null;
    const dotColor=minD!==null?(minD<0?'var(--red)':minD<=7?'var(--red)':minD<=30?'var(--amber)':'var(--green)'):'';
    html+=`<div class="day-cell ${isToday?'today':''}" onclick="selDay(${y},${m},${d})">
      <div class="day-num">${d}</div>
      ${ts.length?`<div class="day-dot" style="background:${dotColor}"></div>`:''}
    </div>`;
  }
  document.getElementById('cal-grid').innerHTML=html;
}
function selDay(y,m,d){
  const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  const ts=tasks.filter(t=>t.due===ds&&!t.done);
  document.getElementById('cal-day-label').textContent=`${m+1}月${d}日的任務`;
  document.getElementById('cal-day-tasks').innerHTML=ts.length
    ?ts.map(t=>`<div class="task-card"><div class="tbody"><div class="tname">${t.name}</div><div class="tmeta">${catBadge(t.cat)}${freqBadge(t.freq)}</div>${t.notes?`<div style="font-size:11px;color:var(--muted);margin-top:3px">${t.notes}</div>`:''}</div></div>`).join('')
    :`<div class="empty-state">這天沒有到期任務</div>`;
}

function renderJournal(){
  const MOOD_LABEL={'😄':'很好','🙂':'還不錯','😐':'普通','😔':'有點累','😤':'很難熬'};
  const CAT_EMOJI={文件:'📄',會議:'📋',稽核:'🔍',校正:'🔧',報告:'📊',合約:'📝',其他:'📌'};

  let jYear=window._jYear||String(curYear);

  let jWeek=window._jWeek||'全部';

  const jYears=[...new Set(journals.map(j=>j.date.slice(0,4)))].sort().reverse();
  if(!jYears.includes(String(curYear))) jYears.unshift(String(curYear));

  const jMonths=['全部',...new Set(
    journals.filter(j=>j.date.startsWith(jYear)).map(j=>j.date.slice(5,7))
  ).values()].sort();

  function getWeekNum(dateStr){
    const d=new Date(dateStr); d.setHours(0,0,0,0);
    const y=d.getFullYear();
    return Math.ceil((((d-new Date(y,0,1))/86400000)+new Date(y,0,1).getDay()+1)/7);
  }

  const jWeeks=['全部',...new Set(
    journals.filter(j=>j.date.startsWith(jYear)&&(jMonth==='全部'||j.date.slice(5,7)===jMonth))
    .map(j=>String(getWeekNum(j.date)).padStart(2,'0'))
  ).values()].sort((a,b)=>Number(a)-Number(b));

  function pill(label,active,onclick){
    return `<button onclick="${onclick}" style="font-family:inherit;font-size:11px;padding:3px 10px;border-radius:20px;border:1px solid ${active?'var(--accent)':'var(--border)'};background:${active?'var(--accent-light)':'transparent'};color:${active?'var(--accent)':'var(--muted)'};cursor:pointer;white-space:nowrap">${label}</button>`;

  const MONTH_LABEL=['','1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

  let filtered=journals.filter(j=>j.date.startsWith(jYear));
  if(jMonth!=='全部') filtered=filtered.filter(j=>j.date.slice(5,7)===jMonth);
  if(jWeek!=='全部') filtered=filtered.filter(j=>String(getWeekNum(j.date)).padStart(2,'0')===jWeek);

  const todayDone=tasks.filter(t=>t.done&&t.doneDate===today);

  document.getElementById('tab-journal').innerHTML=`
    <button class="btn btn-primary" style="width:100%;margin-top:.5rem;margin-bottom:.75rem" onclick="openJournalModal()">📝 ${hasJournalToday?'編輯今日日誌':'寫今日日誌'}</button>
    ${reminderHTML}
    <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px">
      <span style="font-size:11px;color:var(--muted)">年</span>
      ${jYears.map(y=>pill(y,jYear===y,`window._jYear='${y}';window._jMonth='全部';window._jWeek='全部';renderJournal()`)).join('')}
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px">
      <span style="font-size:11px;color:var(--muted)">月</span>
      ${jMonths.map(m=>pill(m==='全部'?'全部':MONTH_LABEL[Number(m)],jMonth===m,`window._jMonth='${m}';window._jWeek='全部';renderJournal()`)).join('')}
    </div>
    ${jWeeks.length>2?`<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px">
      <span style="font-size:11px;color:var(--muted)">週</span>
      ${jWeeks.map(w=>pill(w==='全部'?'全部':'第'+Number(w)+'週',jWeek===w,`window._jWeek='${w}';renderJournal()`)).join('')}
    </div>`:''}
    <div class="section-title" style="margin-top:.5rem">共 ${filtered.length} 筆</div>
    ${filtered.length?filtered.map(j=>{
      const completedList=j.completed||[];
      return `<div class="journal-card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <div>
            <span class="journal-date">${fmt(j.date)}</span>
            <span style="font-size:11px;color:var(--muted);margin-left:6px">第${getWeekNum(j.date)}週</span>
          </div>
          <div style="display:flex;align-items:center;gap:6px">
            <span style="font-size:11px;color:var(--muted)">${MOOD_LABEL[j.mood]||''}</span>
            <span style="font-size:18px">${j.mood}</span>
          </div>
        </div>
        ${completedList.length?`<div style="margin-bottom:6px">
          <div style="font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:500">✅ 完成任務</div>
          ${completedList.map(c=>{
            const name=typeof c==='string'?c:c.name;
            const cat=typeof c==='string'?'其他':c.cat;
            return `<div style="font-size:12px;padding:3px 0;display:flex;align-items:center;gap:5px">${CAT_EMOJI[cat]||'📌'} ${name}</div>`;
          }).join('')}
        </div>`:''}
        ${j.note?`<div style="font-size:12px;color:var(--muted);border-top:1px solid var(--border);padding-top:6px;margin-top:4px;line-height:1.6">💬 ${j.note}</div>`:''}
      </div>`;
    }).join('')
    :`<div class="empty-state">這個時段沒有日誌</div>`}
  `;
}
// ===== ALERTS =====
function renderAlerts(){
  const exp=tasks.filter(t=>!t.done&&dLeft(t.due)!==null&&dLeft(t.due)<0).sort((a,b)=>dLeft(a.due)-dLeft(b.due));
  const s30=tasks.filter(t=>!t.done&&dLeft(t.due)!==null&&dLeft(t.due)>=0&&dLeft(t.due)<=30).sort((a,b)=>dLeft(a.due)-dLeft(b.due));
  const s90=tasks.filter(t=>!t.done&&dLeft(t.due)!==null&&dLeft(t.due)>30&&dLeft(t.due)<=90).sort((a,b)=>dLeft(a.due)-dLeft(b.due));
  function acard(t){
    return `<div class="task-card">
      <div class="tbody">
        <div class="tname">${t.name}</div>
        <div class="tmeta">${catBadge(t.cat)}${statusBadge(dLeft(t.due))}<span style="font-size:10px;color:var(--muted)">${fmt(t.due)}</span></div>
      </div>
      <button class="btn btn-primary btn-sm" onclick="toggleDone(${t.id});renderAlerts()">完成</button>
    </div>`;
  }
  let html='';
  if(exp.length) html+=`<div class="section-title" style="color:var(--red)">🔴 已過期（${exp.length}件）</div>`+exp.map(acard).join('');
  if(s30.length) html+=`<div class="section-title" style="color:var(--amber);margin-top:1rem">🟡 30天內到期（${s30.length}件）</div>`+s30.map(acard).join('');
  if(s90.length) html+=`<div class="section-title" style="margin-top:1rem">📋 90天內到期（${s90.length}件）</div>`+s90.map(acard).join('');
  if(!exp.length&&!s30.length&&!s90.length) html=`<div class="empty-state">目前沒有緊急提醒，做得很好！🎉</div>`;
  document.getElementById('tab-alerts').innerHTML=html;
}

// ===== SETTINGS =====
const THEMES = {
  green:  {accent:'#3d6b4f', light:'#e8f5ee'},
  blue:   {accent:'#1d4ed8', light:'#eff6ff'},
  purple: {accent:'#6d28d9', light:'#f5f3ff'},
  rose:   {accent:'#be185d', light:'#fdf2f8'},
  orange: {accent:'#c2410c', light:'#fff7ed'},
  teal:   {accent:'#0f766e', light:'#f0fdfa'},
  slate:  {accent:'#334155', light:'#f1f5f9'},
  amber:  {accent:'#92400e', light:'#fffbeb'},
  indigo: {accent:'#3730a3', light:'#eef2ff'},
};
let userSettings = JSON.parse(localStorage.getItem('pt_settings')||'{}');

function applyTheme(color, light){
  document.documentElement.style.setProperty('--accent', color);
  document.documentElement.style.setProperty('--accent-light', light);
  document.querySelector('header').style.background = color;
}

function setTheme(name){
  document.querySelectorAll('#theme-picker > div').forEach(el=>el.style.border='3px solid transparent');
  const el = document.getElementById('theme-'+name);
  if(el) el.style.border='3px solid var(--text)';
  document.getElementById('custom-color-row').style.display = name==='custom'?'flex':'none';
  if(name==='custom') return;
  userSettings.theme = name;
  const t = THEMES[name];
  if(t) applyTheme(t.accent, t.light);
}

function applyCustomColor(val){
  userSettings.theme = 'custom';
  userSettings.customColor = val;
  applyTheme(val, val+'22');
}

function saveSettings(){
  const name = document.getElementById('set-name').value.trim();
  if(name){
    userSettings.name = name;
    document.getElementById('site-title').textContent = '🌿 '+name+'的工作管理中心';
  }
  localStorage.setItem('pt_settings', JSON.stringify(userSettings));
  closeModal('modal-settings');
  showToast('✅ 設定已儲存');
}

function openSettingsModal(){
  document.getElementById('set-name').value = userSettings.name||'';
  const cur = userSettings.theme||'green';
  document.querySelectorAll('#theme-picker > div').forEach(el=>el.style.border='3px solid transparent');
  const el = document.getElementById('theme-'+cur);
  if(el) el.style.border='3px solid var(--text)';
  if(cur==='custom'){
    document.getElementById('custom-color-row').style.display='flex';
    document.getElementById('custom-color-pick').value = userSettings.customColor||'#3d6b4f';
  }
  // 更新通知按鈕狀態
  const btn = document.getElementById('notif-btn');
  if(btn){
    if(!('Notification' in window)) btn.textContent='此裝置不支援通知';
    else if(Notification.permission==='granted') btn.textContent='🔔 通知已開啟（點此測試）';
    else if(Notification.permission==='denied') btn.textContent='🚫 通知已封鎖（請到設定開啟）';
    else btn.textContent='🔕 點此開啟通知提醒';
  }
  openModal('modal-settings');
}

async function toggleNotification(){
  if(Notification.permission==='granted'){
    // 發送測試通知
    const today = todayStr();
    const cnt = tasks.filter(t=>!t.done&&(!t.status||t.status==='active')&&t.due&&t.due<=today).length;
    new Notification('🌿 工作管理中心 — 測試通知', {
      body: cnt>0?`目前有 ${cnt} 件任務需要處理`:'目前沒有待處理任務，太棒了！',
      tag:'test'
    });
    showToast('✅ 測試通知已發送！');
    return;
  }
  const granted = await requestNotification();
  if(granted){
    document.getElementById('notif-btn').textContent='🔔 通知已開啟（點此測試）';
    showToast('🔔 通知開啟成功！每天會提醒您的任務');
    checkTodayNotifications();
  }
}

function loadSettings(){
  if(userSettings.name){
    document.getElementById('site-title').textContent = '🌿 '+userSettings.name+'的工作管理中心';
  }
  if(userSettings.theme){
    const t = THEMES[userSettings.theme];
    if(t) applyTheme(t.accent, t.light);
    else if(userSettings.customColor) applyTheme(userSettings.customColor, userSettings.customColor+'22');
  }
  if(!userSettings.name && !userSettings.skippedName){
    setTimeout(()=>openModal('modal-welcome'), 600);
  }
}

// ===== PWA & 通知 =====
async function initPWA(){
  if(!('serviceWorker' in navigator)) return;
  try {
    await navigator.serviceWorker.register('./sw.js');
    console.log('SW registered');
  } catch(e) { console.log('SW fail:', e); }
}

async function requestNotification(){
  if(!('Notification' in window)){
    showToast('您的瀏覽器不支援通知功能');
    return false;
  }
  if(Notification.permission === 'granted') return true;
  if(Notification.permission === 'denied'){
    showToast('通知已被封鎖，請到瀏覽器設定開啟');
    return false;
  }
  const perm = await Notification.requestPermission();
  return perm === 'granted';
}

// 每次開啟頁面時檢查今日到期任務並推播
async function checkTodayNotifications(){
  const granted = Notification.permission === 'granted';
  if(!granted) return;
  const today = todayStr();
  const notifiedKey = 'pt_notified_'+today;
  if(localStorage.getItem(notifiedKey)) return; // 今天已通知過

  const todayTasks = tasks.filter(t=>!t.done&&(!t.status||t.status==='active')&&t.due===today);
  const overdue = tasks.filter(t=>!t.done&&(!t.status||t.status==='active')&&t.due&&t.due<today);
  const soon = tasks.filter(t=>{
    if(t.done||!(!t.status||t.status==='active')||!t.due||t.due<=today) return false;
    const d = Math.round((new Date(t.due)-new Date(today))/86400000);
    return d<=3;
  });

  let msgs = [];
  if(todayTasks.length) msgs.push(`今天到期 ${todayTasks.length} 件`);
  if(overdue.length) msgs.push(`已過期 ${overdue.length} 件`);
  if(soon.length) msgs.push(`3天內到期 ${soon.length} 件`);

  if(msgs.length){
    new Notification('🌿 工作管理中心', {
      body: msgs.join('　|　'),
      icon: './icon-192.png',
      tag: 'daily-check'
    });
    localStorage.setItem(notifiedKey, '1');
  }
}

// 設定每日定時通知（用 setTimeout 模擬）
function scheduleDaily(){
  const now = new Date();
  const next8 = new Date(now);
  next8.setHours(8,0,0,0);
  if(next8 <= now) next8.setDate(next8.getDate()+1);
  const ms = next8 - now;
  setTimeout(()=>{
    checkTodayNotifications();
    setInterval(checkTodayNotifications, 24*60*60*1000);
  }, ms);
}

// ===== BATCH DELETE =====
let batchMode = false;
let batchSelected = new Set();

function toggleBatchMode(){
  batchMode = true;
  batchSelected.clear();
  document.getElementById('batch-bar').style.display='flex';
  renderDaily();
}
function cancelBatchMode(){
  batchMode = false;
  batchSelected.clear();
  document.getElementById('batch-bar').style.display='none';
  renderDaily();
}
function toggleBatchSelect(id){
  if(batchSelected.has(id)) batchSelected.delete(id);
  else batchSelected.add(id);
  document.getElementById('batch-count').textContent='已選 '+batchSelected.size+' 件';
  renderDaily();
}
function selectAllTasks(){
  tasks.forEach(t=>batchSelected.add(t.id));
  document.getElementById('batch-count').textContent='已選 '+batchSelected.size+' 件';
  renderDaily();
}
function confirmBatchDelete(){
  if(!batchSelected.size) return;
  if(!confirm('確定刪除選取的 '+batchSelected.size+' 件任務？此操作無法復原')) return;
  tasks = tasks.filter(t=>!batchSelected.has(t.id));
  save('tasks');
  cancelBatchMode();
  showToast('🗑 已刪除 '+batchSelected.size+' 件任務');
}

// ===== INIT =====
loadSettings();
renderDaily();
initPWA();
setTimeout(checkTodayNotifications, 2000);
scheduleDaily();
</script>
