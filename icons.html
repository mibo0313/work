<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, sans-serif; background: #f5f3ef; padding: 1.5rem; }
h2 { font-size: 18px; margin-bottom: 1rem; color: #1a1a1a; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 2rem; }
.item { background: white; border-radius: 16px; padding: 1rem; text-align: center; cursor: pointer; border: 3px solid transparent; transition: all .2s; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
.item:hover { border-color: #3d6b4f; transform: scale(1.03); }
.item.selected { border-color: #3d6b4f; background: #f0fdf4; }
.item svg { width: 80px; height: 80px; border-radius: 18px; box-shadow: 0 3px 10px rgba(0,0,0,.15); }
.item .name { font-size: 12px; color: #888; margin-top: 8px; }
.btn { width: 100%; padding: 14px; background: #3d6b4f; color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; }
.btn:active { opacity: .85; }
.toast { display: none; position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); background: #1a1a1a; color: white; padding: 10px 20px; border-radius: 20px; font-size: 13px; }
</style>
</head>

let selected = 0;

function render(){
  const grid = document.getElementById('grid');
  grid.innerHTML = icons.map((ic,i)=>`
    <div class="item ${i===selected?'selected':''}" onclick="select(${i})">
      ${ic.svg}
      <div class="name">${ic.name}</div>
    </div>
  `).join('');
}

function select(i){
  selected = i;
  render();
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display='block';
  setTimeout(()=>t.style.display='none', 2500);
}

function applyIcon(){
  const svgStr = icons[selected].svg.trim();
  const b64 = btoa(unescape(encodeURIComponent(svgStr)));
  const dataUrl = 'data:image/svg+xml;base64,'+b64;
  // 複製 data URL 到剪貼簿
  const code = `<link rel="apple-touch-icon" href="${dataUrl}">\n<link rel="icon" type="image/svg+xml" href="${dataUrl}">`;
  navigator.clipboard.writeText(dataUrl).then(()=>{
    showToast('✅ 圖示 data URL 已複製！');
  }).catch(()=>{
    // fallback
    const ta = document.createElement('textarea');
    ta.value = dataUrl;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('✅ 已複製！');
  });
}

render();
</script>

</html>
